user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name fast-furious.work.gd;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name fast-furious.work.gd;

        ssl_certificate /etc/letsencrypt/live/fast-furious.work.gd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fast-furious.work.gd/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://web:8000/api/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /redoc {
            proxy_pass http://web:8000/api/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://web:8000/api/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /flower/ {
            proxy_pass http://flower:5555/;
            auth_basic "Restricted";
            auth_basic_user_file /etc/nginx/auth/.htpasswd;
        }

        client_max_body_size 100M;
    }
}