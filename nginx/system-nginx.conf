user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Logging Settings
    access_log /var/log/nginx/access.log;

    # Gzip Settings
    gzip on;

    # Upstream definition for Docker nginx
    upstream docker_nginx_http {
        server 127.0.0.1:8080;
    }

    upstream docker_nginx_https {
        server 127.0.0.1:8443;
    }

    # HTTP Server
    server {
        listen 80;
        listen [::]:80;
        server_name fast-furious.work.gd;

        location / {
            proxy_pass http://docker_nginx_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # HTTPS Server  
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name fast-furious.work.gd;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/fast-furious.work.gd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fast-furious.work.gd/privkey.pem;

        location / {
            proxy_pass https://docker_nginx_https;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
} 