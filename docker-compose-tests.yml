services:
  api_test:
    build:
      context: .
      dockerfile: ./docker/tests/Dockerfile
    container_name: cinema_api_test
    command: ["pytest", "-v", "--disable-warnings", "--tb=short"]
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=testing
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DB=cinema_test_db
      - POSTGRES_HOST=postgres_test
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis_test
      - REDIS_PORT=6379
      - EMAIL_HOST=mailhog_test
      - EMAIL_PORT=1025
      - EMAIL_HOST_USER=testuser@cinema.com
      - EMAIL_HOST_PASSWORD=test_password
      - EMAIL_USE_TLS=False
      - MAILHOG_API_PORT=8025
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - MINIO_HOST=minio_test
      - MINIO_PORT=9000
      - MINIO_BUCKET=cinema-storage-test
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_started
      mailhog_test:
        condition: service_started
      minio_test:
        condition: service_healthy
    volumes:
      - ./src:/app
    networks:
      - cinema_test_network

  postgres_test:
    image: postgres:15-alpine
    container_name: cinema_postgres_test
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DB=cinema_test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d cinema_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - cinema_test_network

  redis_test:
    image: redis:7-alpine
    container_name: cinema_redis_test
    networks:
      - cinema_test_network

  mailhog_test:
    build:
      context: .
      dockerfile: docker/mailhog/Dockerfile
    container_name: cinema_mailhog_test
    ports:
      - "8026:8025"
      - "1026:1025"
    environment:
      - MAILHOG_USER=testuser
      - MAILHOG_PASSWORD=testpassword
    volumes:
      - mailhog_auth:/mailhog.auth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cinema_test_network

  minio_test:
    image: minio/minio:latest
    container_name: cinema_minio_test
    command: server --console-address ":9001" /data
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema_test_network

  minio_mc_test:
    build:
      context: .
      dockerfile: docker/minio_mc/Dockerfile
    container_name: cinema_minio_mc_test
    command: ["/bin/sh", "-c", "/commands/setup_minio.sh"]
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - MINIO_HOST=minio_test
      - MINIO_PORT=9000
      - MINIO_BUCKET=cinema-storage-test
    depends_on:
      minio_test:
        condition: service_healthy
    networks:
      - cinema_test_network

volumes:
  postgres_test_data:
  minio_test_data:
  mailhog_auth:

networks:
  cinema_test_network:
    driver: bridge
