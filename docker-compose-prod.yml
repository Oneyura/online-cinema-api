services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.prod
    environment:
      - PYTHONPATH=/usr/src/app
    depends_on:
      - postgres
      - redis
      - minio
      - mailhog
    networks:
      - cinema_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  postgres:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.worker.celery worker --loglevel=info
    restart: always
    env_file:
      - .env.prod
    environment:
      - PYTHONPATH=/usr/src/app
    depends_on:
      - redis
      - postgres
    networks:
      - cinema_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.worker.celery beat --loglevel=info
    restart: always
    env_file:
      - .env.prod
    environment:
      - PYTHONPATH=/usr/src/app
    depends_on:
      - redis
      - postgres
    networks:
      - cinema_network

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.worker.celery flower --port=5555
    restart: always
    env_file:
      - .env.prod
    environment:
      - PYTHONPATH=/usr/src/app
    depends_on:
      - redis
      - celery_worker
    networks:
      - cinema_network

  minio:
    image: minio/minio:latest
    restart: always
    command: server --console-address ":9001" /data
    env_file:
      - .env.prod
    volumes:
      - minio_data:/data
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio_mc:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env.prod
    entrypoint: >
      /bin/sh -c "
      mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing myminio/${MINIO_BUCKET};
      mc policy set public myminio/${MINIO_BUCKET};
      exit 0;
      "
    networks:
      - cinema_network

  mailhog:
    image: druidfi/mailhog:1.0.1
    restart: always
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/auth:/etc/nginx/auth:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - flower
      - minio
      - mailhog
    networks:
      - cinema_network

networks:
  cinema_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mailhog_data:
