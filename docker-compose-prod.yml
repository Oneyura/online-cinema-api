services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - postgres
      - redis
      - minio
      - mailhog
    networks:
      - cinema_network

  postgres:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.tasks.celery worker --loglevel=info
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - redis
      - postgres
    networks:
      - cinema_network

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.tasks.celery flower --port=5555
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - redis
      - celery
    networks:
      - cinema_network

  minio:
    image: minio/minio:latest
    restart: always
    command: server --console-address ":9001" /data
    env_file:
      - .env.prod
    volumes:
      - minio_data:/data
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"

  mailhog:
    build:
      context: .
      dockerfile: docker/mailhog/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      - MAILHOG_USER=${MAILHOG_USER}
      - MAILHOG_PASSWORD=${MAILHOG_PASSWORD}
    volumes:
      - mailhog_data:/mailhog.auth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cinema_network

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/auth:/etc/nginx/auth:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
    networks:
      - cinema_network

networks:
  cinema_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mailhog_data:
